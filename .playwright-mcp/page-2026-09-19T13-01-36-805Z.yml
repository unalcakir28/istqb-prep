            - paragraph [ref=f1e117]: ISTQB®, 130’dan fazla ülkede kâr amacı gütmeyen, gönüllü dernekler şeklinde yazılım test ve kalitesi konusunda faaliyetlerini sürdüren dünya çapındaki en büyük uluslararası yazılım test organizasyondur.
          - paragraph [ref=f1e124]: Yazılım Test ve Kalite Derneği, 2006 yılından bu yana uluslararası ISTQB® sertifika sınavlarını gerçekleştirerek sınavda başarılı olan katılımcılara uluslararası geçerliliği olan sertifikalar vermektedir.
          - generic [ref=f1e125]: ISTQB® sertifikasyon sınavları için yetkili uluslararası sınav sağlayıcısı
          - paragraph [ref=f1e145]: "TTB® kalite yönetim sistemi ISO 9001’e, TTB® personel belgelendirme sistemi ISO 17024’e uygundur. TTB® ISO 9001 ve ISO 17024 sertifikalarının geçerlilik tarihi: 14 Mayıs 2027."
