      - heading "Sertifikalı Test Uzmanı Temel Seviye (CTFL) v4.0.1 Müfredatı – Türkçe" [level=1] [ref=f1e72]
      - main [ref=f1e77]:
        - article [ref=f1e78]:
          - generic [ref=f1e85]:
            - generic [ref=f1e87]:
              - paragraph [ref=f1e88]: ISTQB® CTFL Syllabus v4.0.1 TTB tarafından uygulanan sınavlarda 6 Mayıs 2024 tarihinden itibaren geçerli olacaktır. Sertifika üzerinde syllabus versiyonuna yer verilmekte olup, geçmiş tarihli sertifikalar da geçerliliğini koruyacaktır.
              - paragraph [ref=f1e89]: ISTQB® Sertifikalı Test Uzmanı Temel Seviye Ders Programının 2018 Türkçe versiyonunun yayınlamasının üzerinden yaklaşık 5 yıl geçti. Bu süre zarfında hem yazılım test sektöründe çok önemli gelişmeler oldu hem de sektör Türkiye’de ve dünyada yıllık ortalama %20 oranında bir ivmeyle büyüme kaydetti. İşte bu doküman değişen yazılım ve yazılım test dünyasındaki son gelişmeleri yansıtmak amacıyla ISTQB® tarafından revize edilerek, Nisan 2023’de bilişim sektörünün hizmetine sunulmuştur. Dokümanda özellikle Çevik yazılım geliştirme ve DevOps yaklaşımlarının teste etkisi göze çarpmaktadır.
              - paragraph [ref=f1e90]: Dokümana aşağıdaki butondan ulaşabilirsiniz.
            - link "Syllabus" [ref=f1e94] [cursor=pointer]:
              - /url: https://www.turkishtestingboard.org/files/pdfs/ISTQB_CTFL_Syllabus-v4.0.1.pdf
