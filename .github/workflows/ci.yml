name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format

      - name: Type check
        run: yarn typecheck

      - name: Test
        run: yarn test

      # Content is the product here: a data set that fails validation must
      # never reach the site, so this gates everything downstream.
      - name: Validate data
        run: yarn validate:data

      # Bilingualism is an inviolable rule, but i18next silently falls back to
      # English for a missing Turkish key, so a half-translated UI is green
      # everywhere else — this is the only step that fails on it.
      - name: Validate UI locales
        run: yarn validate:i18n

      - name: Build
        run: yarn build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # End-to-end flow + axe accessibility scan. These start their own dev
      # server (playwright.config.ts) and are the only check that exercises
      # the real exam from the home page through to the review screen.
      - name: End-to-end and accessibility
        run: yarn e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
