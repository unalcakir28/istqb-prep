<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Prepare for the ISTQB Foundation Level exam (CTFL v4.0.1): original questions, a rationale for every option, Turkish and English side by side. Free and open source."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>ISTQB-PREP</title>
    <script>
      // Apply the theme BEFORE the first paint: otherwise a dark-theme user
      // sees one frame of white screen (FOUC).
      (function () {
        try {
          var stored = localStorage.getItem("istqb-prep:theme");
          var dark =
            stored === "dark" ||
            ((stored === "system" || stored === null) &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          // If storage is disabled, carry on with the light theme.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
