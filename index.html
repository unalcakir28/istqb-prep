<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ISTQB Temel Seviye (CTFL v4.0.1) sınavına hazırlık: özgün sorular, her şık için gerekçe, Türkçe–İngilizce yan yana. Ücretsiz ve açık kaynak."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>ISTQB-PREP</title>
    <script>
      // Temayi ilk boyamadan ONCE uygula: aksi halde koyu tema kullanicisi
      // bir kare beyaz ekran gorur (FOUC).
      (function () {
        try {
          var stored = localStorage.getItem("istqb-prep:theme");
          var dark =
            stored === "dark" ||
            ((stored === "system" || stored === null) &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          // Depolama kapaliysa acik tema ile devam.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
